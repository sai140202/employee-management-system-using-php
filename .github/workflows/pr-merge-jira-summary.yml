name: PR Merge - AI Summary & Jira Update

# Run only when a pull request is merged.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  summarize-and-update-jira:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history so we can diff against the previous commit

      - name: Resolve commit range
        id: range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "Diffing $BASE_SHA..$HEAD_SHA"

      - name: Get commit changes (diff + file list + messages)
        id: changes
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          mkdir -p .commit-context

          # Unified diff
          git diff --no-color "$BASE_SHA" "$HEAD_SHA" > .commit-context/full.diff || true

          # Changed files
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > .commit-context/files.txt || true

          # Commit messages in this push
          git log --pretty=format:'- %h %s%n%b' "$BASE_SHA..$HEAD_SHA" \
            > .commit-context/messages.txt || true

          # Detect large diffs and build a compact representation instead of raw diff
          DIFF_LINES=$(wc -l < .commit-context/full.diff)
          LARGE_DIFF_THRESHOLD=500

          if [ "$DIFF_LINES" -gt "$LARGE_DIFF_THRESHOLD" ]; then
            echo "Diff is ${DIFF_LINES} lines (>${LARGE_DIFF_THRESHOLD}) — switching to stat + per-file samples."

            # Overall stat (e.g. 12 files changed, 1234 insertions, 56 deletions)
            git diff --stat "$BASE_SHA" "$HEAD_SHA" > .commit-context/diff_stat.txt || true

            # First 30 lines of diff per changed file (up to 20 files)
            > .commit-context/diff_samples.txt
            while IFS= read -r filepath; do
              echo "=== $filepath ===" >> .commit-context/diff_samples.txt
              git diff --no-color "$BASE_SHA" "$HEAD_SHA" -- "$filepath" \
                | head -n 30 >> .commit-context/diff_samples.txt
              echo "" >> .commit-context/diff_samples.txt
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | head -n 20)

            echo "large=true" >> "$GITHUB_OUTPUT"
          else
            # Small diff: keep the original truncated approach
            head -c 60000 .commit-context/full.diff > .commit-context/diff.txt
            echo "large=false" >> "$GITHUB_OUTPUT"
          fi

          echo "diff_lines=$DIFF_LINES"                         >> "$GITHUB_OUTPUT"
          echo "diff_bytes=$(wc -c < .commit-context/full.diff)" >> "$GITHUB_OUTPUT"

      - name: Call AI for 2-line summary (Groq)
        id: ai_summary
        env:
          # Create the secret with: gh secret set GROQ_API_KEY
          # Get a key at https://console.groq.com/keys
          GROQ_API_KEY: ${{ secrets.GROQ_AI }}
          # Override via repo variable GROQ_MODEL if you want, e.g. llama-3.3-70b-versatile,
          # llama-3.1-8b-instant, mixtral-8x7b-32768, gemma2-9b-it
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          BRANCH: ${{ github.head_ref }}
          PUSHER: ${{ github.event.pull_request.user.login }}
          LARGE_DIFF: ${{ steps.changes.outputs.large }}
          DIFF_LINES: ${{ steps.changes.outputs.diff_lines }}
        run: |
          set -euo pipefail

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY secret is not set. Add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          FILES_CONTENT=$(cat .commit-context/files.txt)
          MESSAGES_CONTENT=$(cat .commit-context/messages.txt)

          # Build the user prompt text safely with jq.
          # For large diffs (500+ lines) skip the raw diff to avoid overwhelming the model;
          # use the overall stat summary + first-30-lines sample per file instead.
          if [ "${LARGE_DIFF}" = "true" ]; then
            echo "Large diff detected (${DIFF_LINES} lines) — using stat + per-file samples for prompt."
            DIFF_STAT=$(cat .commit-context/diff_stat.txt)
            DIFF_SAMPLES=$(cat .commit-context/diff_samples.txt)

            PROMPT=$(jq -n \
              --arg branch    "$BRANCH" \
              --arg pusher    "$PUSHER" \
              --arg lines     "$DIFF_LINES" \
              --arg msgs      "$MESSAGES_CONTENT" \
              --arg files     "$FILES_CONTENT" \
              --arg stat      "$DIFF_STAT" \
              --arg samples   "$DIFF_SAMPLES" \
              '"Summarize this large push (" + $lines + " lines changed) in EXACTLY 2 concise lines (max ~220 chars total). Prioritize commit messages, then file stats, then the per-file samples. Focus on WHAT changed and WHY it matters. No bullet points, no markdown.\n\nBranch: " + $branch + "\nAuthor: " + $pusher + "\n\nCommit messages:\n" + $msgs + "\n\nChanged files (status + path):\n" + $files + "\n\nDiff statistics:\n" + $stat + "\n\nPer-file diff samples (first 30 lines each, up to 20 files):\n" + $samples')
          else
            DIFF_CONTENT=$(cat .commit-context/diff.txt)

            PROMPT=$(jq -n \
              --arg branch  "$BRANCH" \
              --arg pusher  "$PUSHER" \
              --arg msgs    "$MESSAGES_CONTENT" \
              --arg files   "$FILES_CONTENT" \
              --arg diff    "$DIFF_CONTENT" \
              '"Summarize the following push (one or more commits) in EXACTLY 2 concise lines (max ~220 chars total). Focus on what changed and why it matters. No bullet points, no markdown.\n\nBranch: " + $branch + "\nAuthor: " + $pusher + "\n\nCommit messages:\n" + $msgs + "\n\nChanged files:\n" + $files + "\n\nUnified diff (may be truncated):\n" + $diff')
          fi

          # Groq uses an OpenAI-compatible chat completions API
          PAYLOAD=$(jq -n \
            --arg model  "$GROQ_MODEL" \
            --arg prompt "$PROMPT" \
            '{
               model: $model,
               messages: [
                 {role: "system", content: "You write crisp, factual 2-line commit summaries for Jira."},
                 {role: "user",   content: $prompt}
               ],
               temperature: 0.2,
               max_tokens: 200
             }')

          RESPONSE=$(curl -sS https://api.groq.com/openai/v1/chat/completions \
            -H "Authorization: Bearer ${GROQ_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$SUMMARY" ]; then
            echo "AI response did not contain a summary:"
            echo "$RESPONSE"
            exit 1
          fi

          # Normalize to 2 lines max
          SUMMARY=$(printf "%s" "$SUMMARY" | sed '/^\s*$/d' | head -n 2)

          echo "Generated summary:"
          echo "$SUMMARY"

          {
            echo 'summary<<EOF'
            echo "$SUMMARY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Extract Jira issue key
        id: jira_key
        env:
          BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          # Look for KEY-123 style ids in PR title, commit messages, PR body, then branch name.
          REGEX='[A-Z][A-Z0-9]+-[0-9]+'
          MESSAGES=$(cat .commit-context/messages.txt || true)

          KEY=$(echo "$PR_TITLE" | grep -oE "$REGEX" | head -n1 || true)
          if [ -z "$KEY" ]; then KEY=$(echo "$MESSAGES" | grep -oE "$REGEX" | head -n1 || true); fi
          if [ -z "$KEY" ]; then KEY=$(echo "$PR_BODY"  | grep -oE "$REGEX" | head -n1 || true); fi
          if [ -z "$KEY" ]; then KEY=$(echo "$BRANCH"   | grep -oE "$REGEX" | head -n1 || true); fi

          if [ -z "$KEY" ]; then
            echo "No Jira issue key (e.g. ABC-123) found in PR title, commit messages, PR body, or branch."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found Jira key: $KEY"
            echo "found=true"   >> "$GITHUB_OUTPUT"
            echo "key=$KEY"     >> "$GITHUB_OUTPUT"
          fi

      - name: Show AI summary in workflow output
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
          JIRA_FOUND: ${{ steps.jira_key.outputs.found }}
          SUMMARY: ${{ steps.ai_summary.outputs.summary }}
        run: |
          set -euo pipefail

          echo "===== AI-generated commit summary ====="
          echo "$SUMMARY"
          echo "======================================="

          if [ "$JIRA_FOUND" = "true" ]; then
            echo "Detected Jira key: $JIRA_KEY"
          else
            echo "No Jira key found in commit messages / branch."
          fi

          # Also publish to the GitHub Actions job summary (rendered on the run page)
          {
            echo "## AI Commit Summary"
            echo ""
            echo '```'
            echo "$SUMMARY"
            echo '```'
            if [ "$JIRA_FOUND" = "true" ]; then
              echo ""
              echo "**Detected Jira key:** \`$JIRA_KEY\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Jira issue with AI summary
        if: steps.jira_key.outputs.found == 'true'
        env:
          # Defaults to your Atlassian site; override via repo variable JIRA_BASE_URL if needed.
          JIRA_BASE_URL:  ${{ vars.JIRA_BASE_URL || 'https://sairaj140202.atlassian.net' }}
          JIRA_EMAIL:     ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          # Field to update. Defaults to the built-in "description".
          # For a custom field set repo variable JIRA_FIELD_ID to e.g. "customfield_10010".
          JIRA_FIELD_ID:  ${{ vars.JIRA_FIELD_ID || 'description' }}
          JIRA_KEY:       ${{ steps.jira_key.outputs.key }}
          SUMMARY:        ${{ steps.ai_summary.outputs.summary }}
        run: |
          set -euo pipefail

          if [ -z "${JIRA_EMAIL:-}" ] || [ -z "${JIRA_API_TOKEN:-}" ]; then
            echo "JIRA_EMAIL and/or JIRA_API_TOKEN secrets are not set."
            echo "Add them under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Updating $JIRA_BASE_URL/browse/$JIRA_KEY (field: $JIRA_FIELD_ID)"

          # Jira Cloud requires ADF for rich-text fields like "description".
          # Plain custom text fields accept a string. We send ADF when the
          # target field is "description", otherwise a plain string.
          if [ "$JIRA_FIELD_ID" = "description" ]; then
            FIELD_VALUE=$(jq -n --arg s "$SUMMARY" '
              {
                type: "doc",
                version: 1,
                content: [
                  { type: "paragraph",
                    content: [ { type: "text", text: $s } ] }
                ]
              }')
            BODY=$(jq -n --arg fid "$JIRA_FIELD_ID" --argjson val "$FIELD_VALUE" \
              '{fields: { ($fid): $val }}')
          else
            BODY=$(jq -n --arg fid "$JIRA_FIELD_ID" --arg val "$SUMMARY" \
              '{fields: { ($fid): $val }}')
          fi

          HTTP_CODE=$(curl -sS -o /tmp/jira_resp.txt -w "%{http_code}" \
            -X PUT \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY" \
            -d "$BODY")

          echo "Jira responded with HTTP $HTTP_CODE"
          cat /tmp/jira_resp.txt || true
          echo

          if [ "$HTTP_CODE" != "204" ]; then
            echo "Failed to update Jira issue $JIRA_KEY"
            exit 1
          fi

          echo "Updated $JIRA_BASE_URL/browse/$JIRA_KEY field '$JIRA_FIELD_ID' successfully."
