name: Commit - AI Summary (Jira disabled)

# Run on every push (i.e. whenever new commits land on a branch).
on:
  push:
    branches:
      - "**"   # all branches; restrict to e.g. [main] if you only want default branch

permissions:
  contents: read

jobs:
  summarize-and-update-jira:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history so we can diff against the previous commit

      - name: Resolve commit range
        id: range
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.event.after }}
        run: |
          set -euo pipefail

          # On the first push to a new branch, BEFORE_SHA is all zeros.
          # In that case, diff against the parent of the new HEAD.
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "$ZERO" ]; then
            BASE_SHA=$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || echo "")
            if [ -z "$BASE_SHA" ]; then
              # Brand new repo / orphan commit -> diff against the empty tree.
              BASE_SHA=$(git hash-object -t tree /dev/null)
            fi
          else
            BASE_SHA="$BEFORE_SHA"
          fi

          echo "base=$BASE_SHA"  >> "$GITHUB_OUTPUT"
          echo "head=$AFTER_SHA" >> "$GITHUB_OUTPUT"
          echo "Diffing $BASE_SHA..$AFTER_SHA"

      - name: Get commit changes (diff + file list + messages)
        id: changes
        env:
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          mkdir -p .commit-context

          # Unified diff (truncate to keep prompt size sane)
          git diff --no-color "$BASE_SHA" "$HEAD_SHA" > .commit-context/full.diff || true
          head -c 60000 .commit-context/full.diff > .commit-context/diff.txt

          # Changed files
          git diff --name-status "$BASE_SHA" "$HEAD_SHA" > .commit-context/files.txt || true

          # Commit messages in this push
          git log --pretty=format:'- %h %s%n%b' "$BASE_SHA..$HEAD_SHA" \
            > .commit-context/messages.txt || true

          echo "diff_bytes=$(wc -c < .commit-context/diff.txt)" >> "$GITHUB_OUTPUT"

      - name: Call AI for 2-line summary
        id: ai_summary
        env:
          OPENAI_API_KEY: ${{ secrets.OPAI }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.actor }}
        run: |
          set -euo pipefail

          DIFF_CONTENT=$(cat .commit-context/diff.txt)
          FILES_CONTENT=$(cat .commit-context/files.txt)
          MESSAGES_CONTENT=$(cat .commit-context/messages.txt)

          # Build JSON payload safely with jq
          PROMPT=$(jq -n \
            --arg branch  "$BRANCH" \
            --arg pusher  "$PUSHER" \
            --arg msgs    "$MESSAGES_CONTENT" \
            --arg files   "$FILES_CONTENT" \
            --arg diff    "$DIFF_CONTENT" \
            '"You are a release-notes assistant. Summarize the following push (one or more commits) in EXACTLY 2 concise lines (max ~220 chars total). Focus on what changed and why it matters. No bullet points, no markdown.\n\nBranch: " + $branch + "\nAuthor: " + $pusher + "\n\nCommit messages:\n" + $msgs + "\n\nChanged files:\n" + $files + "\n\nUnified diff (may be truncated):\n" + $diff')

          PAYLOAD=$(jq -n \
            --arg model "$OPENAI_MODEL" \
            --arg prompt "$PROMPT" \
            '{
               model: $model,
               messages: [
                 {role: "system", content: "You write crisp, factual 2-line commit summaries for Jira."},
                 {role: "user",   content: $prompt}
               ],
               temperature: 0.2
             }')

          RESPONSE=$(curl -sS https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$SUMMARY" ]; then
            echo "AI response did not contain a summary:"
            echo "$RESPONSE"
            exit 1
          fi

          # Normalize to 2 lines max
          SUMMARY=$(printf "%s" "$SUMMARY" | sed '/^\s*$/d' | head -n 2)

          echo "Generated summary:"
          echo "$SUMMARY"

          {
            echo 'summary<<EOF'
            echo "$SUMMARY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Extract Jira issue key
        id: jira_key
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Look for KEY-123 style ids in commit messages first, then branch name.
          REGEX='[A-Z][A-Z0-9]+-[0-9]+'
          MESSAGES=$(cat .commit-context/messages.txt || true)

          KEY=$(echo "$MESSAGES" | grep -oE "$REGEX" | head -n1 || true)
          if [ -z "$KEY" ]; then KEY=$(echo "$BRANCH" | grep -oE "$REGEX" | head -n1 || true); fi

          if [ -z "$KEY" ]; then
            echo "No Jira issue key (e.g. ABC-123) found in commit messages or branch."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found Jira key: $KEY"
            echo "found=true"   >> "$GITHUB_OUTPUT"
            echo "key=$KEY"     >> "$GITHUB_OUTPUT"
          fi

      - name: Show AI summary in workflow output (Jira update disabled)
        env:
          JIRA_KEY: ${{ steps.jira_key.outputs.key }}
          JIRA_FOUND: ${{ steps.jira_key.outputs.found }}
          SUMMARY: ${{ steps.ai_summary.outputs.summary }}
        run: |
          set -euo pipefail

          echo "===== AI-generated commit summary ====="
          echo "$SUMMARY"
          echo "======================================="

          if [ "$JIRA_FOUND" = "true" ]; then
            echo "Detected Jira key: $JIRA_KEY (Jira update is currently disabled)"
          else
            echo "No Jira key found in commit messages / branch."
          fi

          # Also publish to the GitHub Actions job summary (rendered on the run page)
          {
            echo "## AI Commit Summary"
            echo ""
            echo '```'
            echo "$SUMMARY"
            echo '```'
            if [ "$JIRA_FOUND" = "true" ]; then
              echo ""
              echo "**Detected Jira key:** \`$JIRA_KEY\` _(update disabled)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      # Jira update is intentionally disabled for now. Uncomment this step
      # (and add the JIRA_* secrets) when you're ready to push to Jira.
      # ---------------------------------------------------------------------
      # - name: Update Jira field with AI summary
